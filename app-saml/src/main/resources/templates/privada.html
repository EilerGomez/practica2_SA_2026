<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Página protegida</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 800px; margin: 60px auto; padding: 0 20px; }
        table { border-collapse: collapse; width: 100%; margin: 20px 0; }
        td, th { border: 1px solid #ddd; padding: 8px 12px; text-align: left; font-size: 14px; }
        th { background: #f5f5f5; }
        .nota { background: #FAEEDA; padding: 12px; border-radius: 6px; font-size: 14px; }
    </style>
</head>
<body>
    <h1>Página protegida</h1>
    <p>Si ves esto, la autenticación por SAML funcionó.</p>

    <h2>NameID</h2>
    <table>
        <tr><th>Identificador</th><td th:text="${nameId}"></td></tr>
    </table>

    <h2>Atributos de la aserción</h2>
    <table>
        <tr th:each="a : ${atributos}">
            <th th:text="${a.key}"></th>
            <td th:text="${a.value}"></td>
        </tr>
    </table>

    <p class="nota">Estos atributos solo aparecen porque se configuraron mappers
    manualmente en Keycloak. SAML no estandariza los nombres de atributos.</p>

    <form th:action="@{/logout}" method="post">
        <button type="submit">Cerrar sesión</button>
    </form>
</body>
</html>
